name: Weekly retrain

on:
  schedule:
    - cron: "23 2 * * 0"   # Sundays 02:23 UTC, away from the :07 prediction runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data       # never overlaps a prediction run
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      # Trains on the committed candles, which the prediction job keeps current
      - name: Train
        run: python scripts/train.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --cached --quiet; then
            echo "model unchanged"
            exit 0
          fi
          VERSION=$(python -c "import json; print(json.load(open('models/meta.json'))['version'])")
          git commit -m "Retrain model ${VERSION}"
          for attempt in 1 2; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push failed (attempt ${attempt}), retrying"
            sleep 10
          done
          exit 1
