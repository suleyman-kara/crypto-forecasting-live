name: Live prediction

on:
  schedule:
    - cron: "7 */4 * * *"   # 7 minutes after each 4h candle closes (00/04/.../20 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Predict, score, write live/
        id: predict
        run: python scripts/predict.py
      - name: Commit
        if: steps.predict.outputs.changed == 'true'
        env:
          CANDLE: ${{ steps.predict.outputs.candle }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ live/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Live prediction ${CANDLE}"
          for attempt in 1 2; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push failed (attempt ${attempt}), retrying"
            sleep 10
          done
          exit 1
